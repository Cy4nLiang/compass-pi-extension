# Dependabot：每月检查一次，只开 PR 不自动合并；合并前照常跑 CI（npm test + npm run check）。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # 三个 pi 宿主包必须同版本一起升（pi-coding-agent 自带 shrinkwrap，pi-ai / pi-tui 只为 tsc 解析而显式声明）
      pi-host:
        patterns:
          - "@earendil-works/*"
    ignore:
      # typebox 钉 1.3.7，跟 pi 宿主捆绑的版本走、不由 Dependabot 提升级：
      # 运行时由宿主解析提供，本仓库升了没用；且更高版本会触发 tsc TS2589 深度实例化错误（见 CLAUDE.md「关键约束」）
      - dependency-name: typebox
      # @types/node 的主版本跟**最低支持的 Node**走（engines >= 22.19，CI 矩阵 22/24），不由 Dependabot 提大版本：
      # 类型包比运行时新，tsc 会放行 Node 22 上不存在的 API，只在 CI 的 22 那条腿运行时才炸——类型比运行时宽是反向保护。
      # 升 Node 基线时手动同步（连 .nvmrc / engines / ci.yml 矩阵一起改）。2026-09-10 据此关掉了 22 → 26 的 PR #5（本地 tsc 能过，但过了不等于该升）
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
