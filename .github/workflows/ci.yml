name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：本工作流只读代码，不写任何东西（新仓库的 token 可能默认已是只读，显式声明零成本）
permissions:
  contents: read

# 同一分支 / PR 连续推送时取消还在跑的旧 run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # 本仓库自身不需要任何 install 脚本，传递依赖的 postinstall 一律不跑（已在临时 clone 里验证 test + check 全绿）
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
